<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | LuangwaStay</title><link rel="stylesheet" href="css/style.css"></head><body data-page="auth"><div id="site-header"></div><main class="container section narrow"><form class="form-card" id="register-form"><span class="eyebrow">JOIN LUANGWASTAY</span><h1>Create an account</h1><label>Account type<select name="account_type" id="account-type"><option value="traveller">Traveller</option><option value="owner">Property owner</option></select></label><label>Full name<input name="full_name" required autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="btn btn-primary full">Create account</button><p id="auth-message" class="form-note"></p><p>Already registered? <a href="login.html">Sign in</a>.</p></form></main><div id="site-footer"></div><script type="module" src="js/app.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Stays | LuangwaStay</title><link rel="stylesheet" href="css/style.css"></head><body data-page="stays"><div id="site-header"></div><main class="page-main"><section class="page-hero"><div class="container"><span class="eyebrow light">FIND YOUR NEXT STAY</span><h1>Explore stays</h1><p>Browse accommodation and find a place that feels right for your journey.</p></div></section><section class="container section"><form class="stay-search-panel" id="stay-search"><label>Destination<input name="q" placeholder="Where are you going?" autocomplete="off"></label><label>Check-in<input name="checkin" type="date"></label><label>Check-out<input name="checkout" type="date"></label><label>Guests<select name="guests"><option value="1">1 guest</option><option value="2">2 guests</option><option value="3">3 guests</option><option value="4">4 guests</option><option value="5">5+ guests</option></select></label><button class="btn btn-primary" type="submit">Search stays</button></form><p class="form-note search-message" id="search-message" role="status" aria-live="polite"></p><div class="stays-layout"><aside class="filters-panel"><h2>Filter by</h2><fieldset><legend>Accommodation type</legend><label><input type="checkbox" name="stay-type" value="lodge"> Lodges</label><label><input type="checkbox" name="stay-type" value="hotel"> Hotels</label><label><input type="checkbox" name="stay-type" value="guesthouse"> Guesthouses</label><label><input type="checkbox" name="stay-type" value="backpackers"> Backpackers</label><label><input type="checkbox" name="stay-type" value="self-catering"> Self-catering</label></fieldset><label class="budget-label" for="price-filter">Price per night</label><select id="price-filter"><option value="">Any price</option><option value="under-1000">Under ZMW 1,000</option><option value="1000-2000">ZMW 1,000–2,000</option><option value="over-2000">Over ZMW 2,000</option></select></aside><section class="stay-results" aria-label="Stay search results"><div class="results-top"><p id="results-count">Discover available places</p><label for="sort-stays">Sort by <select id="sort-stays"><option value="recommended">Recommended</option><option value="price-low">Price (lowest first)</option><option value="price-high">Price (highest first)</option><option value="name">Name A–Z</option></select></label></div><div class="cards-grid stay-results-list" id="all-properties"></div></section></div></section></main><div id="site-footer"></div><script type="module" src="js/app.js"></script></body></html>
